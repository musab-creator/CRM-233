name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build roofing-crm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roofing-crm
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Node 20 to match replit.nix and the @types/node major in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: roofing-crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
